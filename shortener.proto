syntax = "proto3";


package grpc_api_gen;

option go_package = "proto/";


message CreateNewCodeReq{
    string url = 1;
}

message CreateNewCodeResp{
    string url = 1;
    string code = 2;
}

message GetOriginalUrlReq {
  string code = 1;
}

message GetOriginalUrlResp {
  string url = 1;
}

service Shortener{
    rpc CreateNewCode(CreateNewCodeReq) returns (CreateNewCodeResp);
    rpc GetOriginalUrl(GetOriginalUrlReq) returns (GetOriginalUrlResp);
}


