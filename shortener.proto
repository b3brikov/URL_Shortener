syntax = "proto3";


package grpc_api_gen;

option go_package = "proto/";
message LoginReq{
    string email  = 1;
    string password = 2;
}

message LoginResp {
    int64 id = 1;
    string access = 2;
    string refresh = 3;
    int64 access_ttl = 4;
    int64 refresh_ttl = 5;
}

message CreateNewCodeReq{
    string url = 1;
}

message CreateNewCodeResp{
    string url = 1;
    string code = 2;
}

message RegisterReq{
    string email = 1;
    string password = 2;
}

message RegisterResponse{
    string status = 1;
}

service Shortener{
    rpc Login(LoginReq) returns (LoginResp) {}
    rpc CreateNewCode(CreateNewCodeReq) returns (CreateNewCodeResp) {}
    rpc Register(RegisterReq) returns (RegisterResponse) {}
}


